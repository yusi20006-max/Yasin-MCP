[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasin-mcp"
version = "0.1.0"
description = "Standalone AI/Agent-facing MCP access and integration layer for the Yasin ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "PyYAML>=6,<7",
    # Termux/Android Python 3.14 currently needs the Python shared library
    # preloaded for cryptography's Rust extension to resolve CPython symbols.
    # Keep this constraint explicit so the dependency is reproducible while
    # the upstream Termux dynamic-linking issue is unresolved.
    "cryptography<49; platform_system == 'Android'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Ruff currently does not install reliably on native Termux/Android.
    # Keep it in the development environment for supported CI platforms,
    # but do not attempt to install it on Android.
    "ruff>=0.4.0; platform_system != 'Android'",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "types-PyYAML>=6.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
yasin-mcp = "yasin_mcp.server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["yasin_mcp*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.bandit]
exclude_dirs = ["tests"]
